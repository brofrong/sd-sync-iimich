<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    The app icon: a five-petal flower in Immich's colors inside a ring of
    two sync arrows, on the macOS 1024 grid (an 824 body, 100 margin).
    scripts/icons.sh renders it into the macOS, Windows and Linux icons
    and the colored tray frames; for the frames it turns the "ring" group
    (rotate(0 512 512)), and for Windows, Linux and the tray it crops the
    view to the body.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2748" />
      <stop offset="1" stop-color="#352f78" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.10" />
      <stop offset="0.5" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7bff" stop-opacity="0.30" />
      <stop offset="1" stop-color="#8b7bff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.30" />
    </filter>
    <!-- One petal, from the centre up; five turn around it, each over the one before. -->
    <path id="petal" d="M0 0 C-12 -14 -16 -38 -2 -50 C12 -62 38 -56 44 -38 C50 -22 30 -8 0 0Z" />
    <!-- The top petal again, over the last one where they meet. -->
    <clipPath id="over"><rect x="-80" y="-80" width="80" height="160" transform="rotate(35)" /></clipPath>
    <!-- Each petal's outline cuts a thin gap into the one under it. -->
    <mask id="gaps" maskUnits="userSpaceOnUse" x="-80" y="-80" width="160" height="160">
      <g fill="#fff" stroke="#000" stroke-width="3">
        <use href="#petal" />
        <use href="#petal" transform="rotate(72)" />
        <use href="#petal" transform="rotate(144)" />
        <use href="#petal" transform="rotate(216)" />
        <use href="#petal" transform="rotate(288)" />
        <use href="#petal" clip-path="url(#over)" />
      </g>
    </mask>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)" />
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)" />
  <circle cx="512" cy="512" r="330" fill="url(#glow)" />

  <g transform="translate(512 512) scale(3.4) rotate(-10)" mask="url(#gaps)">
    <use href="#petal" fill="#fa2921" />
    <use href="#petal" transform="rotate(72)" fill="#ffb400" />
    <use href="#petal" transform="rotate(144)" fill="#18c249" />
    <use href="#petal" transform="rotate(216)" fill="#1e83f7" />
    <use href="#petal" transform="rotate(288)" fill="#ed79b5" />
    <use href="#petal" clip-path="url(#over)" fill="#fa2921" />
  </g>

  <g id="ring" transform="rotate(0 512 512)" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M243.8 424.9 A282 282 0 0 1 745.8 354.3" />
    <path d="M759.2 270.5 L745.8 354.3 L663.0 335.3" />
    <path d="M780.2 599.1 A282 282 0 0 1 278.2 669.7" />
    <path d="M264.8 753.5 L278.2 669.7 L361.0 688.7" />
  </g>
</svg>
