immich:
  url: ""
  api_key: ""

watch:
  volume_uuid: ""
  volume_name: ""

scan:
  auto_paths: true
  paths:
    - "DCIM"
  extensions:
    - "jpg"
    - "jpeg"
    - "arw"
    - "mp4"
  exclude_patterns:
    - "._*"

upload:
  concurrency: 0           # 0 = auto (4 параллельные загрузки)
  checkpoint_interval: 150 # сброс прогресса на диск каждые N файлов (100–200)

state:
  db_path: "~/.config/sd-sync-immich/state.db"

card:
  auto_eject: true   # извлекать карту после загрузки
  auto_format: false # форматировать карту, когда всё с неё есть в Immich

notifications:
  enabled: true      # общий выключатель
  done: true
  errors: true
  other_card: true
  server: true
  card: true
