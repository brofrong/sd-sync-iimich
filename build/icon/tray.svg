<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!--
    The macOS menu bar icon (a template image: black and alpha, which the
    menu bar tints): app.svg's flower and ring of sync arrows in one color,
    on a 44-pixel (22-point @2x) canvas. scripts/icons.sh renders a frame
    per turn of the "ring" group (rotate(0 22 22)).
  -->
  <defs>
    <path id="petal" d="M0 0 C-12 -14 -16 -38 -2 -50 C12 -62 38 -56 44 -38 C50 -22 30 -8 0 0Z" />
    <!-- The top petal again, over the last one where they meet. -->
    <clipPath id="over"><rect x="-80" y="-80" width="80" height="160" transform="rotate(35)" /></clipPath>
    <!-- Each petal's outline cuts a gap into the one under it, as in app.svg. -->
    <mask id="petals" maskUnits="userSpaceOnUse" x="-80" y="-80" width="160" height="160">
      <g fill="#fff" stroke="#000" stroke-width="7">
        <use href="#petal" />
        <use href="#petal" transform="rotate(72)" />
        <use href="#petal" transform="rotate(144)" />
        <use href="#petal" transform="rotate(216)" />
        <use href="#petal" transform="rotate(288)" />
        <use href="#petal" clip-path="url(#over)" />
      </g>
    </mask>
  </defs>

  <g transform="translate(22 22) scale(0.16) rotate(-10)">
    <rect x="-80" y="-80" width="160" height="160" fill="#000" mask="url(#petals)" />
  </g>

  <g id="ring" transform="rotate(0 22 22)" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.21 17.52 A14.5 14.5 0 0 1 34.02 13.89" />
    <path d="M34.99 8.17 L34.02 13.89 L28.36 12.65" />
    <path d="M35.79 26.48 A14.5 14.5 0 0 1 9.98 30.11" />
    <path d="M9.01 35.83 L9.98 30.11 L15.64 31.35" />
  </g>
</svg>
