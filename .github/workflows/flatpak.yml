name: Flatpak

# Builds the Flatpak from packaging/flatpak offline, as Flathub would, and
# keeps the bundle as an artifact to try out. Runs when the packaging or
# the dependencies change, and on demand.
on:
  push:
    branches: ["**"]
    paths:
      - packaging/flatpak/**
      - go.mod
      - go.sum
      - frontend/package-lock.json
      - .github/workflows/flatpak.yml
  workflow_dispatch:

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # The build is offline: the Go modules come from vendor/.
      - name: Vendor Go modules
        run: go mod vendor

      - name: Set the version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(git describe --tags --always)
          sed -i "s/SDSYNC_VERSION: dev/SDSYNC_VERSION: $version/" packaging/flatpak/io.github.brofrong.sd-sync-immich.yml

      - name: Build
        uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          bundle: SD-Sync-Immich.flatpak
          manifest-path: packaging/flatpak/io.github.brofrong.sd-sync-immich.yml
          cache-key: flatpak-builder-${{ github.sha }}

      # Flathub's checks, on the manifest and on the built repository. The
      # screenshots and remote icons are mirrored by Flathub's own builds,
      # so those errors are expected here and left out.
      - name: Lint
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          lint() { flatpak run --command=flatpak-builder-lint org.flatpak.Builder "$@"; }
          lint --exceptions manifest packaging/flatpak/io.github.brofrong.sd-sync-immich.yml > lint-manifest.json || true
          lint --exceptions repo repo > lint-repo.json || true
          cat lint-manifest.json lint-repo.json
          python3 - <<'PY'
          import json, sys
          expected = {
              "appstream-external-screenshot-url",
              "appstream-screenshots-not-mirrored-in-ostree",
              "appstream-remote-icon-not-mirrored",
          }
          failed = False
          for name in ("lint-manifest.json", "lint-repo.json"):
              with open(name) as f:
                  text = f.read().strip()
              errors = set(json.loads(text).get("errors", [])) if text else set()
              left = sorted(errors - expected)
              print(name, "errors:", left or "none")
              failed = failed or bool(left)
          sys.exit(1 if failed else 0)
          PY
