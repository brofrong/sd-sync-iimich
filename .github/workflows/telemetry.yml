name: Telemetry server

# Tests the statistics server (cmd/sd-sync-telemetry) and, on main, pushes
# its image to ghcr.io/brofrong/sd-sync-telemetry (:latest and the commit)
# and asks Arcane to update the running container when the
# ARCANE_WEBHOOK_URL secret is set.
on:
  push:
    paths:
      - cmd/sd-sync-telemetry/**
      - internal/telemetryserver/**
      - build/telemetry/**
      - go.mod
      - go.sum
      - .github/workflows/telemetry.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./internal/telemetryserver ./cmd/sd-sync-telemetry

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built on every push; pushed only from main.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/telemetry/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/brofrong/sd-sync-telemetry:latest
            ghcr.io/brofrong/sd-sync-telemetry:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update the running server
        if: github.ref == 'refs/heads/main'
        env:
          WEBHOOK: ${{ secrets.ARCANE_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "ARCANE_WEBHOOK_URL is not set: the server is updated by hand."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK" -o /dev/null
