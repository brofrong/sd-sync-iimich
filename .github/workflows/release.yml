name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        env:
          CGO_ENABLED: 1
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/dmitiigorshkov/sd-sync-immich/internal/version.Current=${GITHUB_REF_NAME}"
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/sd-sync-immich-darwin-arm64 ./cmd/sd-sync-immich
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/sd-sync-immich-darwin-amd64 ./cmd/sd-sync-immich
          lipo -create -output dist/sd-sync-immich dist/sd-sync-immich-darwin-arm64 dist/sd-sync-immich-darwin-amd64
          chmod +x dist/sd-sync-immich dist/sd-sync-immich-darwin-arm64 dist/sd-sync-immich-darwin-amd64

      - name: Package checksums
        run: |
          cd dist
          shasum -a 256 sd-sync-immich sd-sync-immich-darwin-arm64 sd-sync-immich-darwin-amd64 > checksums.txt

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/sd-sync-immich
            dist/sd-sync-immich-darwin-arm64
            dist/sd-sync-immich-darwin-amd64
            dist/checksums.txt
