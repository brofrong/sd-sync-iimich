name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Frontend, arm64/amd64/universal binaries, the signed app bundle,
      # its zip and checksums.txt (see the script). The CGO flags and
      # -tags production are set by the script.
      - name: Build release
        env:
          WAILS3: wails3
        run: scripts/build-app.sh "$GITHUB_REF_NAME" dist

      # sd-sync-immich and checksums.txt keep their names: v0.3.0's updater
      # downloads them to migrate to the bundle, and the in-app updater
      # downloads them too.
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/sd-sync-immich
            dist/sd-sync-immich-darwin-arm64
            dist/sd-sync-immich-darwin-amd64
            dist/SD-Sync-Immich.zip
            dist/checksums.txt
