name: Release

# A v* tag builds macOS, Windows and Linux (AppImage and Flatpak) and publishes one GitHub release
# with every system's files and one checksums.txt for all of them.
#
# Run by hand (Actions → Release → Run workflow, or
# `gh workflow run release.yml --ref <branch>`) it builds the same files
# and uploads them as workflow artifacts without publishing: a dry run.
# It publishes only when run on a v* tag with "publish" checked.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release (only on a v* tag)
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Embedded in the binaries: the tag, or "dev" for a run on a branch (a
  # dev build never updates itself).
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # dmgbuild lays out the DMG window; pinned with hashes.
      - name: Install dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --require-hashes --only-binary=:all: -r build/darwin/dmg/requirements.txt
          echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"

      # Frontend, arm64/amd64/universal binaries, the signed app bundle, its
      # zip and the DMG (see the script). The CGO flags and -tags production
      # are set by the script. Its checksums.txt covers only these files and
      # stays here: the release job writes the one for all systems.
      - name: Build release
        env:
          WAILS3: wails3
        run: scripts/build-app.sh "$VERSION" dist

      # The DMG holds the signed app, the link to /Applications and the
      # window's background. Any extended attributes on the app are listed
      # first: codesign --strict rejects Finder info on it.
      - name: Check DMG
        run: |
          hdiutil verify dist/SD-Sync-Immich.dmg
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/SD-Sync-Immich.dmg
          trap 'hdiutil detach "$mnt"' EXIT
          ls -la "$mnt"
          test "$(readlink "$mnt/Applications")" = /Applications
          test -f "$mnt/.background.tiff"
          xattr -lr "$mnt/SD Sync Immich.app" | head -20
          codesign --verify --deep --strict "$mnt/SD Sync Immich.app"

      # sd-sync-immich keeps its name: v0.3.0's updater downloads it to
      # migrate to the bundle, and the in-app updater downloads it too.
      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            dist/sd-sync-immich
            dist/sd-sync-immich-darwin-arm64
            dist/sd-sync-immich-darwin-amd64
            dist/SD-Sync-Immich.zip
            dist/SD-Sync-Immich.dmg

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      # Keep the checkout byte for byte as in git, as CI does.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # windows-latest has no NSIS (as of 2026-10); install the version the
      # installer script is checked with, unless one is already there.
      - name: Install NSIS
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --version=3.11.0 --no-progress --yes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Frontend, sd-sync-immich.exe (icon, manifest, version info) and the
      # installer (build/windows/installer.nsi); see the script.
      - name: Build release
        run: ./scripts/build-windows.ps1 -Version $env:VERSION -OutDir dist

      # The in-app updater downloads the installer by this name.
      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: dist/SD-Sync-Immich-Setup-x64.exe

  linux:
    name: Linux
    # Its glibc (2.35) is the oldest the AppImage runs with; it has
    # WebKitGTK 4.1 (GTK 3), which the gtk3 build tag selects.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Frontend, sd-sync-immich and the AppImage with GTK and WebKitGTK in
      # it (wails3 generate appimage); see the script.
      - name: Build release
        run: scripts/build-linux.sh "$VERSION" dist

      # The Go modules for the Flathub build, which is offline (see
      # packaging/flatpak). Sorted, with fixed owners and times, so the
      # same go.sum gives the same archive.
      - name: Vendor Go modules
        run: |
          go mod vendor
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 \
            -cJf dist/sd-sync-immich-vendor.tar.xz vendor

      # The in-app updater downloads the AppImage by this name.
      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            dist/SD-Sync-Immich-x86_64.AppImage
            dist/SD-Sync-Immich-x86_64.flatpak
            dist/sd-sync-immich-vendor.tar.xz

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # The build is offline (see packaging/flatpak): the Go modules come
      # from vendor/.
      - name: Vendor Go modules
        run: go mod vendor

      - name: Set the version
        run: |
          sed -i "s/SDSYNC_VERSION: dev/SDSYNC_VERSION: $VERSION/" packaging/flatpak/io.github.brofrong.sd-sync-immich.yml

      # The bundle installs the GNOME runtime from Flathub.
      - name: Build
        uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          bundle: SD-Sync-Immich-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.brofrong.sd-sync-immich.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: release-flatpak
          if-no-files-found: error
          path: SD-Sync-Immich-x86_64.flatpak

  release:
    name: Release
    needs: [macos, windows, linux, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      # One checksums.txt for every system's files, in the format of
      # `shasum -a 256` ("<sha256>  <name>"): v0.3.0's updater and the
      # in-app updater find their file's line by name. sha256sum fails if a
      # file is missing.
      - name: Write checksums.txt
        working-directory: dist
        run: |
          ls -l
          sha256sum \
            sd-sync-immich \
            sd-sync-immich-darwin-arm64 \
            sd-sync-immich-darwin-amd64 \
            SD-Sync-Immich.zip \
            SD-Sync-Immich.dmg \
            SD-Sync-Immich-Setup-x64.exe \
            SD-Sync-Immich-x86_64.AppImage \
            SD-Sync-Immich-x86_64.flatpak \
            sd-sync-immich-vendor.tar.xz \
            > checksums.txt
          cat checksums.txt

      # Everything the release would get, for a dry run.
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release
          if-no-files-found: error
          path: |
            dist/sd-sync-immich
            dist/sd-sync-immich-darwin-arm64
            dist/sd-sync-immich-darwin-amd64
            dist/SD-Sync-Immich.zip
            dist/SD-Sync-Immich.dmg
            dist/SD-Sync-Immich-Setup-x64.exe
            dist/SD-Sync-Immich-x86_64.AppImage
            dist/SD-Sync-Immich-x86_64.flatpak
            dist/sd-sync-immich-vendor.tar.xz
            dist/checksums.txt

      # sd-sync-immich, the zip and checksums.txt keep their names (v0.3.0's
      # updater and the in-app updater download them by name); so do the
      # installer and the AppImage.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            **Windows и Linux — бета.** macOS: `SD-Sync-Immich.dmg`; Windows 10/11: `SD-Sync-Immich-Setup-x64.exe`; Linux x86_64: `SD-Sync-Immich-x86_64.AppImage` или `SD-Sync-Immich-x86_64.flatpak`. Установка и ограничения — в [README](https://github.com/brofrong/sd-sync-immich/blob/main/README.ru.md).
          files: |
            dist/sd-sync-immich
            dist/sd-sync-immich-darwin-arm64
            dist/sd-sync-immich-darwin-amd64
            dist/SD-Sync-Immich.zip
            dist/SD-Sync-Immich.dmg
            dist/SD-Sync-Immich-Setup-x64.exe
            dist/SD-Sync-Immich-x86_64.AppImage
            dist/SD-Sync-Immich-x86_64.flatpak
            dist/sd-sync-immich-vendor.tar.xz
            dist/checksums.txt
