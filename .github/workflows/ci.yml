name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    env:
      CGO_ENABLED: "1"
      # Wails' cgo objects otherwise target the SDK's macOS version and ld
      # warns about each of them; 13.0 is the app's minimum macOS (see
      # scripts/build-app.sh). "-O2 -g" keeps Go's default cgo flags.
      CGO_CFLAGS: -O2 -g -mmacosx-version-min=13.0
      CGO_LDFLAGS: -O2 -g -mmacosx-version-min=13.0
      # scripts/build-frontend.sh uses the Wails CLI installed below.
      WAILS3: wails3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary # bun lint is only in canary for now

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build frontend
        run: scripts/build-frontend.sh

      # The TypeScript bindings are committed (the Flatpak build cannot run
      # the Wails CLI): the ones just generated must match.
      - name: Bindings up to date
        run: |
          if [ -n "$(git status --porcelain frontend/bindings)" ]; then
            git status --porcelain frontend/bindings
            echo "frontend/bindings is out of date: run scripts/build-frontend.sh and commit it" >&2
            exit 1
          fi

      - name: Lint frontend
        working-directory: frontend
        run: bun lint

      - name: Format frontend
        working-directory: frontend
        run: bun fmt --check

      - name: Check frontend
        working-directory: frontend
        run: bun check

      - name: Build
        run: go build -o sd-sync-immich ./cmd/sd-sync-immich

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      # Git on Windows checks out with CRLF, which breaks the bash scripts.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The script runs the Wails CLI pinned in it through `go run`.
      - name: Build frontend
        shell: bash
        run: scripts/build-frontend.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    env:
      # Wails builds against GTK 4 and WebKitGTK 6 unless the gtk3 tag
      # selects GTK 3 and WebKitGTK 4.1, the only WebKitGTK ubuntu-22.04
      # has (see scripts/test-linux.sh).
      GOFLAGS: -tags=gtk3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The script runs the Wails CLI pinned in it through `go run`.
      - name: Build frontend
        run: scripts/build-frontend.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
