name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    env:
      CGO_ENABLED: "1"
      # Wails' cgo objects otherwise target the SDK's macOS version and ld
      # warns about each of them; 13.0 is the app's minimum macOS (see
      # scripts/build-app.sh). "-O2 -g" keeps Go's default cgo flags.
      CGO_CFLAGS: -O2 -g -mmacosx-version-min=13.0
      CGO_LDFLAGS: -O2 -g -mmacosx-version-min=13.0
      # scripts/build-frontend.sh uses the Wails CLI installed below.
      WAILS3: wails3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build frontend
        run: scripts/build-frontend.sh

      - name: Check frontend
        working-directory: frontend
        run: npm run check

      - name: Build
        run: go build -o sd-sync-immich ./cmd/sd-sync-immich

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
